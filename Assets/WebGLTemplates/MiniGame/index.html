<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* ゲーム画面はシーンごとの縦横比(9:16 / 16:9)の箱に収め、余りは黒帯にする */
    #unity-canvas { position: absolute; display: block; background: #0d1520; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #fff; font: 16px sans-serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">読み込み中… <span id="progress">0</span>%</div>
  <script>
    // C# の WebScreen.SetAspect から呼ばれる。最初はタイトル(縦)に合わせておく
    var aspect = 9 / 16;
    var canvas = document.getElementById('unity-canvas');

    function fitCanvas() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = w, ch = w / aspect;
      if (ch > h) { ch = h; cw = h * aspect; }
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.left = (w - cw) / 2 + 'px';
      canvas.style.top = (h - ch) / 2 + 'px';
    }

    window.miniGameSetAspect = function (width, height) {
      aspect = width / height;
      fitCanvas();
    };

    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    var buildUrl = 'Build';
    var config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // 高解像度スマホで等倍描画すると重いので2倍までに抑える
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var script = document.createElement('script');
    script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById('progress').textContent = Math.round(p * 100);
      }).then(function () {
        document.getElementById('loading').remove();
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
